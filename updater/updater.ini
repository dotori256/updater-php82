; 런처 설정 파일 - Updater.exe 와 같은 폴더(bin)에 두세요.
; 관리 사이트 [설정 / 설치] 탭에서 솔루션별로 채워진 파일을 바로 받을 수 있습니다.

; 통합 배포관리 사이트 주소
ServerUrl=https://example.com/updates/

; 솔루션 ID
App=MWAGENT

; 서버 config.php 에 CLIENT_KEY 를 설정했다면 같은 값
;ClientKey=

; 실행할 메인 프로그램 (bin 기준 경로). 비워두면 관리 사이트 설정 사용
LaunchExe=

; 메인 프로그램에 넘길 인자 (비워두면 관리 사이트 설정 사용)
LaunchArgs=

; 업데이트가 끝나면 자동 실행(1) / [실행] 버튼을 누를 때까지 대기(0)
AutoStart=1

; 서버 응답 대기 시간(초)
TimeoutSec=15

; 런처 화면 표시(1) / 화면 없이 조용히 업데이트 후 실행(0)
ShowWindow=1

; 관리 사이트에서 "PC에서도 삭제"한 파일을 PC에서도 삭제 (1/0)
DeleteRemovedFiles=1
