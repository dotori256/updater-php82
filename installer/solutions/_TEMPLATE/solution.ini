; 솔루션별 MSI 설정 - 이 폴더를 solutions\<솔루션ID> 로 복사해서 고치세요.
; 폴더 이름 = 솔루션 ID (관리 사이트에 등록한 ID 와 똑같이, 예: MWAGENT)
; UTF-8 로 저장하세요. 따옴표(") 와 < > $ 는 쓸 수 없습니다.

; 제어판 [앱 목록] 에 보이는 이름
ProductName=새 솔루션

; 회사명 (제어판 게시자). 설치 폴더와 시작 메뉴 폴더 이름으로도 쓰입니다
Manufacturer=회사명

; 설치 프로그램 버전 (MSI 규칙: 0~255.0~255.0~65535).
; 프로그램 버전이 아니라 "설치 파일" 버전입니다. 서버 주소·아이콘 등을 바꿔 MSI 를 다시 만들 때만 올리세요.
Version=1.0.0

; 아래는 비워두면 기본값
;CompanyFolder=           (기본: Manufacturer)  → Program Files (x86)\<CompanyFolder>\<InstallFolderName>
;InstallFolderName=       (기본: 솔루션 ID)
;ShortcutName=            (기본: ProductName)  바탕화면·시작 메뉴 바로가기 이름
;ShortcutDescription=
;DesktopShortcut=1        (0 이면 바탕화면 바로가기 없음, 시작 메뉴는 항상 만듦)
;Icon=icon.ico            (이 폴더 기준. 없으면 기본 런처 아이콘)
;Logo=logo.png            (이 폴더 기준. 있으면 bin 에 넣어 런처 화면 로고로 사용)
;UpgradeCode=             (비우면 솔루션 ID 로 자동 계산. 한 번 배포한 뒤에는 바꾸지 마세요)

; ---- updater.ini 에 들어갈 값 ----
; 관리 사이트 [설정 / 설치] 탭에서 받은 updater.ini 를 이 폴더에 넣으면 그 파일을 그대로 쓰고 아래 값은 무시합니다 (권장).
ServerUrl=https://example.com/updates/
;SignKey=
;ClientKey=
